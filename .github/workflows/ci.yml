name: CI

on:
  push:
    branches:
      - "master"
  pull_request:

env:
  GOLANGCILINT_VERSION: "2.13.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ env.GOLANGCILINT_VERSION }}

  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            test_target: test-race
            GOARCH: amd64
            # race requires cgo, otherwise should not be needed
            CGO_ENABLED: 1
          # build and test on 32 bit, does not support race
          - os: ubuntu-latest
            test_target: test
            GOARCH: "386"
            CGO_ENABLED: 0
          - os: macos-latest
            test_target: test
            GOARCH: amd64
            CGO_ENABLED: 0
          - os: windows-latest
            test_target: test
            GOARCH: amd64
            CGO_ENABLED: 0
    runs-on: ${{ matrix.os }}
    steps:
      # only run cli binary tests on linux
      - name: Install expect
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: sudo apt-get install expect
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      - name: Test
        env:
          CGO_ENABLED: ${{ matrix.CGO_ENABLED }}
          GOARCH: ${{ matrix.GOARCH }}
        run: make ${{ matrix.test_target }}
